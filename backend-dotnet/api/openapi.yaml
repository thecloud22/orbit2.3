    post:
      tags: [Documents]
      operationId: receiveDocument
      summary: A document arrives for a requirement
      description: |
        ONE transaction saves the document (`status: received`) and an outbox event `document_received`, then returns `201`. The requirement is not
        changed here: the workflow decides. The outbox relay starts the short workflow `DocumentReceivedWorkflow` (`event-<outbox event id>`), which
        does the outside-system work and ends:

        * **Claimant statement + W-9** (`kind: claimant_statement_w9`): the taxpayer number is checked with the IRS (stub). "No match" is an
          ANSWER, not an error: the document becomes `not_enough` ("TIN mismatch"), the requirement `not_enough`, its follow-up row closes, a
          7-day correction follow-up row is written, the examiner gets a work item and the claimant a letter (W9-LIFE-01). A real failure
          (timeout, 503) is retried by Temporal. "Match": the requirement is accepted through the normal accept path (its follow-up rows close, and
          proof of loss completes when it was the last one). If an earlier run of the same workflow queued the W9-LIFE-01 letter and failed
          before sending it, a re-run that gets a match marks that letter `skipped` (with a reason), and a re-run that gets "no match" again sends
          it (same row, same idempotency key): no letter stays `queued` after its workflow has finished.
        * **Death certificate** (`kind: death_certificate`): a certified original is accepted. A photocopy (`attributes.photocopy: true` or
          `attributes.sealPresent: false`) is NOT: the requirement becomes `received` (under review), the document `under_review`, the examiner gets
          the work item "Review death certificate" and a `document_review_by` deadline row (1 business day), and the workflow ends. The person decides
          with `POST /documents/{id}:review`.
        * **Police report** (`police_report`) for the report requirement is accepted; `other` goes to the examiner for review.

        Name the requirement with `requirementId`, or with `requirementKey` (and `partyId` for a claimant statement). A corrected W-9 is simply
        another document: another event, another workflow. Idempotent by `Idempotency-Key` (a repeat returns the same document, 200).
      x-slice-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Actor'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReceiveDocumentRequest' }
      responses:
        '201':
          description: The saved document. `status` is `received`; the workflow follows.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '200':
          description: 'Same `Idempotency-Key` and body as an earlier call: the document it created (`Idempotent-Replayed: true`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

