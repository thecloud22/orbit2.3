        again under the SAME workflow id: Temporal's id-reuse policy `ALLOW_DUPLICATE_FAILED_ONLY` allows it because the last run failed (a completed or
        running id can never be started again). The new run is recorded as `runNo: 2` and `rerunOfId` = this run. Everything it does is idempotent:
        letters carry the same idempotency key, so nothing goes twice; when it succeeds it closes the ops work item the failure opened. Returns
        `202` at once: the run itself is asynchronous (poll `GET /claims/{id}/workflow-runs`).
        `X-Actor` is any label (authentication is not built); it is recorded in the history as the operator.
      x-slice-status: implemented
