openapi: 3.1.0
info:
  title: Claims API (life claim slice)
  version: 0.2.0
  summary: Individual life, disability income and annuity claims. This version covers one life claim from intake to closed (decision, payment run, close).
  description: |
    Derived from the React mock's `web/src/api` modules (their doc comments carry the verbs). Where the mock's shape is
    unsuitable for a real API the difference is deliberate; the full list is in `backend/README.md` ("Deviations from the mock").

    **Conventions**

    * **Ids** are UUIDs. Claims also have a human `claimNumber` (`L-26-043310`), unique, filterable, never used in paths.
    * **Money** is `{ "amount": "200000.00", "currency": "USD" }`: a decimal string with at most 2 decimals, never a JSON number.
    * **Timestamps** are RFC 3339 in UTC (`2026-09-25T15:03:00Z`). Business dates (date of death, issue date) are plain dates.
    * **Enum values** are snake_case, the same strings the database stores (and the deadline kinds in the architecture doc).
    * **Idempotency**: POSTs that create something take an `Idempotency-Key` header (8 to 128 characters). A repeat with the
      same key and body returns the resource it created (200, `Idempotent-Replayed: true`); the same key with a different body is 409.
    * **Optimistic concurrency**: every mutable resource has a `version`, returned as its `ETag` (`"3"`). State-changing calls on
      an existing resource require `If-Match`: missing is 428, stale is 412.
    * **Errors** are `application/problem+json` (RFC 9457) with a stable machine-readable `code`.
    * **Asynchrony**: the API commits and returns; workflows follow. A newly created claim is `received` until the intake
      workflow has set it up. Poll `GET /claims/{id}` or `/claims/{id}/workflow-runs`.
    * **Slice status**: every operation carries `x-slice-status`: `implemented` (built and tested in this repo) or
      `contract-only` (specified so the shapes are settled, not built yet).
    * **Authentication is not built.** The `X-Actor` header is a development placeholder for the acting user. Decisions, approvals and
      the authority check need it to be a staff handle (`rachel`, the life examiner with a $250,000 limit; `monica`, the team lead with
      $1,000,000); everything else takes any label.
    * **Claim status**: `received`, `gathering_evidence`, `in_review` (proof of loss complete), `awaiting_approval` (decision above the
      examiner's authority), `approved` (payment items cleared, waiting for a payment run), `paying` (items are in a run), `closed`, and
      `reopened` (a closed claim whose payment the bank returned; it closes again when the replacement item is paid).
    * **Documents and things that come back** (the "things bounce back" scenario): a document arrives (`POST /claims/{id}/documents`), is saved
      with an outbox event, and a short workflow decides what to do with it. A person's review of a document, a bank return processed by the
      returns batch and a payee's new account are each saved in Postgres first and followed by a short event workflow (`event-<outbox event id>`).
      No workflow waits for a person: waiting is a deadline row or a work item. A failed workflow run stays visible and an operator can re-run it
      (`POST /workflow-runs/{id}:rerun`) under the same workflow id.
    * **No CORS.** The API sends no CORS headers. The web app calls it through its own dev server's `/api` proxy (Vite `server.proxy`,
      target `DEMO_API_TARGET`, default `http://127.0.0.1:8080`), so the browser only ever talks to one origin.
    * **Dev endpoints** (tag `dev`, marked `x-dev-only`) exist only when `Claims:Dev:Controls=true`. They are 404 in every other
      configuration and must never be enabled in production.
  contact:
    name: Claims platform team
    email: claims-platform@example.com
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - { name: Claims, description: 'A claim, created from a life intake, and its state.' }
  - { name: Requirements, description: 'The evidence a claim waits on.' }
  - { name: Deadlines, description: 'Every service level and follow-up is a row here; a dispatcher fires the ones that come due.' }
  - { name: Decisions, description: 'Locked, versioned decision records; above the examiner''s authority a team lead approves.' }
  - { name: Payments, description: 'Payment items and the payment run (a batch, not a workflow).' }
  - { name: Letters, description: 'Outbound letters and messages.' }
  - { name: History, description: 'Append-only audit trail.' }
  - { name: Work items, description: 'A person''s queue.' }
  - { name: Staff, description: 'Who the owner ids are and how much each may approve (read-only).' }
  - { name: Workflow runs, description: 'What each Temporal workflow run did, and re-running a failed one.' }
  - { name: Documents, description: 'Documents that arrive for a requirement; a short workflow reads them, and a person reviews the ones the rules cannot accept.' }
  - name: dev
    description: 'Virtual clock, fault switches and the stub bank''s returns queue, for demos and tests. Only when Claims:Dev:Controls=true; 404 otherwise.'
    x-dev-only: true

security:
  - bearerAuth: []

paths:
  /claims/life-intake:
    post:
      tags: [Claims]
      operationId: createLifeClaim
      summary: Create a claim from a life intake (notice of death)
      description: |
        One transaction saves the claim, parties, policy snapshot, benefit lines, requirements, the first deadline rows, history
        and an outbox event, then returns `201` with the claim in status `received`. No workflow has run yet: the outbox relay
        starts `orch-<claimNumber>-intake` afterwards. (Mock: `submitLifeIntake` does all of it inline.)
      x-slice-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Actor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifeIntakeRequest'
      responses:
        '201':
          description: Created. `Location` is the claim.
          headers:
            Location: { schema: { type: string } }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '200':
          description: The same Idempotency-Key and body were already accepted; the claim it created.
          headers:
            Idempotent-Replayed: { schema: { type: string, const: 'true' } }
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /claims:
    get:
      tags: [Claims]
      operationId: listClaims
      summary: List claims, newest first
      description: Mock `listClaims(ownerId)` and `searchClaims(q)` (free-text search is not built).
      x-slice-status: implemented
      parameters:
        - { name: owner, in: query, schema: { type: string, format: uuid } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/ClaimStatus' } }
        - { name: family, in: query, schema: { $ref: '#/components/schemas/Family' } }
        - { name: claimNumber, in: query, schema: { type: string, pattern: '^[LDA]-[0-9]{2}-[0-9]{6}$' } }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of claim summaries.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ClaimSummary' } }
                  nextCursor: { type: [string, 'null'] }
        '400': { $ref: '#/components/responses/BadRequest' }

  /claims/{claimId}:
    parameters: [{ $ref: '#/components/parameters/ClaimId' }]
    get:
      tags: [Claims]
      operationId: getClaim
      summary: Get a claim
      description: |
        The resource is the claim's facts and state. The mock's presentation fields (`tags`, `facts`, `stage`, `clocks`, `nextStep`,
        `summary`, `sections`, `exceptions`, `suggestions`) are projections, not stored state, and are not part of this resource;
        `stage` derives from `status`, `clocks` from `deadlines`.
      x-slice-status: implemented
      responses:
        '200':
          description: The claim.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Claim' }
        '404': { $ref: '#/components/responses/NotFound' }

  /claims/{claimId}/requirements:
    parameters: [{ $ref: '#/components/parameters/ClaimId' }]
    get:
      tags: [Requirements]
      operationId: listClaimRequirements
      summary: Requirements on a claim
      description: Mock `listRequirements(claimId)`.
      x-slice-status: implemented
      responses:
        '200':
          description: All requirements, oldest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequirementList' }
        '404': { $ref: '#/components/responses/NotFound' }

  /requirements/{requirementId}:
    parameters: [{ $ref: '#/components/parameters/RequirementId' }]
    get:
      tags: [Requirements]
      operationId: getRequirement
      summary: Get a requirement
      description: One requirement, with its ETag for a later accept or waive.
      x-slice-status: implemented
      responses:
        '200':
          description: The requirement.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requirement' }
        '404': { $ref: '#/components/responses/NotFound' }

  /requirements/{requirementId}:accept:
    parameters: [{ $ref: '#/components/parameters/RequirementId' }]
    post:
      tags: [Requirements]
      operationId: acceptRequirement
      summary: Accept a requirement
      description: |
        Postgres only, one transaction: the requirement becomes `accepted`, its waiting follow-up deadline rows close without
        firing, and if it was the last one, proof of loss is complete (status `in_review`, `decision_due` and `review_target`
        rows written, a work item for the owner). Mock: `markReceived` / `satisfyRequirement`. The event workflow that would call
        this when a document is classified is not built.
      x-slice-status: implemented
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/Actor'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                satisfiedBy: { type: string, description: 'What satisfied it, shown on the requirement.' }
      responses:
        '200':
          description: The accepted requirement.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requirement' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /requirements/{requirementId}:waive:
    parameters: [{ $ref: '#/components/parameters/RequirementId' }]
    post:
      tags: [Requirements]
      operationId: waiveRequirement
      summary: Waive a requirement, with a reason
      description: Mock `waiveRequirement`. Same effects as accept. A reason is required (422 `reason_required`).
      x-slice-status: implemented
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/Actor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        '200':
          description: The waived requirement.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Requirement' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /claims/{claimId}/deadlines:
    parameters: [{ $ref: '#/components/parameters/ClaimId' }]
    get:
      tags: [Deadlines]
      operationId: listClaimDeadlines
      summary: Deadline rows for a claim
      description: Mock `LifeFlow.deadlines` in `GET /claims/{id}/workflow`, split into its own resource.
      x-slice-status: implemented
      responses:
        '200':
          description: All rows, oldest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeadlineList' }
        '404': { $ref: '#/components/responses/NotFound' }

  /deadlines:
    get:
      tags: [Deadlines]
      operationId: listDeadlines
      summary: Deadlines across claims (operations view)
      description: What is open, overdue, or dispatched and stuck. Ordered by `dueAt`.
      x-slice-status: implemented
      parameters:
        - { name: state, in: query, schema: { $ref: '#/components/schemas/DeadlineState' } }
        - { name: kind, in: query, schema: { $ref: '#/components/schemas/DeadlineKind' } }
        - { name: dueBefore, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 500, default: 100 } }
      responses:
        '200':
          description: Deadline rows.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeadlineList' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /deadlines/{deadlineId}:
    parameters: [{ $ref: '#/components/parameters/DeadlineId' }]
    get:
      tags: [Deadlines]
      operationId: getDeadline
      summary: Get a deadline row
      description: One deadline row, with its ETag for a later extension.
      x-slice-status: implemented
      responses:
        '200':
          description: The row.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deadline' }
        '404': { $ref: '#/components/responses/NotFound' }

  /deadlines/{deadlineId}:extend:
    parameters: [{ $ref: '#/components/parameters/DeadlineId' }]
    post:
      tags: [Deadlines]
      operationId: extendDeadline
      summary: Extend an open deadline, with a reason
      description: A row update, not a new timer. `dueAt` moves, `originalDueAt` stays, the history records why.
      x-slice-status: implemented
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/Actor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newDueAt, reason]
              properties:
                newDueAt: { type: string, format: date-time }
                reason: { type: string, minLength: 1 }
      responses:
        '200':
          description: The extended row.
          headers: { ETag: { $ref: '#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deadline' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /claims/{claimId}/decisions:
    parameters: [{ $ref: '#/components/parameters/ClaimId' }]
    get:
      tags: [Decisions]
      operationId: listClaimDecisions
      summary: Locked decision records, every version
      description: |
        Mock `listDecisions` (and `GET /claims/{id}/decisions?asOf=` in replay.ts, which becomes the `asOf` filter). Includes decisions that
        are still `awaiting_approval` (recorded by an examiner above their authority, not yet approved).

        Each decision's `amount` covers only its own benefit line (the base line and each rider are separate decisions). `claimTotal` is the
        claim-level convenience: the sum of the `amount` of the decisions that count (`in_effect` or `awaiting_approval`; a version that a later
        one supersedes does not count), as Money, or null when none has an amount. It follows `asOf`: it totals the versions returned.
      x-slice-status: implemented
      parameters:
        - { name: asOf, in: query, description: Return the versions recorded at or before this instant., schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Decisions, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Decision' } }
                  nextCursor: { type: [string, 'null'] }
                  claimTotal:
                    anyOf: [ { $ref: '#/components/schemas/Money' }, { type: 'null' } ]
                    description: Sum of the `amount` of the counting decisions (base line plus riders), or null when none has an amount. Additive; older clients ignore it.
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Decisions]
      operationId: recordDecision
      summary: Record a decision on a benefit line
      description: |
        The acting examiner is the staff user whose handle is in `X-Actor` (`rachel`, `monica` in Development; unknown handle is 403
        `unknown_actor`). The claim must be `in_review` (409 `claim_not_ready_to_decide`).

        The decision covers the base benefit line and the riders that follow it: a rider that does not pay (the accidental death rider on a
        natural death) is closed with its own `closed` decision and the ADB-LIFE-03 explanation; a payable rider is approved with it.
        Interest is 3.5% a year, date of death to the pay date, on each line's amount, split by beneficiary share (the last payee takes the
        rounding). The pay date is the next business day after the decision.

        **Within the recorder's authority** (`payout_limit` of the staff user, compared with proceeds plus interest): ONE transaction locks
        the decision (an immutable version), writes a payment item per payee per line (status `cleared`), closes `decision_due`,
        `review_target` and the status letter row, writes the `payment_due` row, moves the claim to `approved`, completes the examiner's work
        item, writes history and an outbox event. Then `201`. The outbox relay starts the short workflow `event-<decisionId>` that sends the
        approval letters (APR-LIFE-01) and tells the agent of record; its run shows in `/claims/{id}/workflow-runs`.

        **Above authority**: the decision is recorded (and locked) as `awaiting_approval`, the claim becomes `awaiting_approval`, and the team
        lead gets a work item. Nothing is paid and no letter is sent until a team lead calls `POST /decisions/{id}:approve`. `202`.

        Only `approve` is built; `approve_in_part` and `deny` are 422 `outcome_not_supported` (the second-review path comes with the complex
        scenario). `supersedesId` (a correction) is likewise 422 `correction_not_supported`. Mock: `recordDecision`.
      x-slice-status: implemented
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ActorRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordDecisionRequest' }
      responses:
        '201':
          description: Decision recorded and in effect.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordDecisionResult' }
        '200':
          description: The same Idempotency-Key and body were already accepted; the result it produced.
          headers:
            Idempotent-Replayed: { schema: { type: string, const: 'true' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordDecisionResult' }
        '202':
          description: Above the recorder's authority; recorded as `awaiting_approval`. `approvalWorkItemId` is the team lead's work item.
          headers:
            Location: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordDecisionResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /decisions/{decisionId}:
    parameters: [{ $ref: '#/components/parameters/DecisionId' }]
    get:
      tags: [Decisions]
      operationId: getDecision
      summary: Get one decision version
      description: 'One immutable decision version. Decisions have no ETag: they are never updated.'
      x-slice-status: implemented
      responses:
        '200':
          description: The decision.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Decision' }
        '404': { $ref: '#/components/responses/NotFound' }

  /decisions/{decisionId}:approve:
    parameters: [{ $ref: '#/components/parameters/DecisionId' }]
    post:
      tags: [Decisions]
      operationId: approveDecision
      summary: Approve a decision that is above the recorder's authority
      description: |
        A team lead (staff role `team_lead`, in `X-Actor`) completes a decision that is `awaiting_approval`. It approves the whole act
        (the base line and its riders). The approver's own `payout_limit` must cover proceeds plus interest, and cannot be the person who
        recorded the decision. Then the same single transaction as a within-authority decision runs (payment items `cleared`, rows closed,
        `payment_due` written, claim `approved`, outbox event); interest is recomputed to the pay date after the approval. Mock: `approve`
        (`onApprove`). Approving the same decision twice is 409 `not_awaiting_approval`. No `If-Match`: a decision has no version.
      x-slice-status: implemented
      parameters:
        - $ref: '#/components/parameters/ActorRequired'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, description: 'Shown in the history.' }
      responses:
        '200':
          description: Approved; the decision is now in effect and its payment items are cleared.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordDecisionResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /claims/{claimId}/payment-items:
    parameters: [{ $ref: '#/components/parameters/ClaimId' }]
    get:
      tags: [Payments]
      operationId: listClaimPaymentItems
      summary: Payment items for a claim
      description: Mock `GET /claims/{id}/payments`. Items are the contract between claims and payments. Oldest first.
      x-slice-status: implemented
      responses:
        '200':
          description: Items.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/PaymentItem' } }
                  nextCursor: { type: [string, 'null'] }
        '404': { $ref: '#/components/responses/NotFound' }

  /payment-items/{paymentItemId}:hold:
    parameters: [{ $ref: '#/components/parameters/PaymentItemId' }]
    post:
      tags: [Payments]
      operationId: holdPaymentItem
      summary: Hold a payment item
      description: |
        Only an item not yet in a run (`awaiting_proof` or `cleared`) can be held. A hold that arrives after the item is `in_run` is 409
        `item_in_run` and becomes a recovery work item instead; only the payment run touches an item in a run. A paid item is 409
        `invalid_state`. A held item is skipped by every run and keeps the claim open until it is released and paid.
      x-slice-status: implemented
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/Actor'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        '200':
          description: The held item.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentItem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /payment-items/{paymentItemId}:release:
    parameters: [{ $ref: '#/components/parameters/PaymentItemId' }]
    post:
      tags: [Payments]
      operationId: releasePaymentItem
      summary: Release a held payment item
      description: A `held` item goes back to `cleared` and is paid by the next run whose date is on or after its `payOn`. Any other state is 409 `invalid_state`.
      x-slice-status: implemented
      parameters:
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/Actor'
      responses:
        '200':
          description: The released item.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaymentItem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }

  /payment-runs:
    get:
      tags: [Payments]
      operationId: listPaymentRuns
      summary: Payment runs, newest first
      description: The daily runs and any manual runs.
      x-slice-status: implemented
