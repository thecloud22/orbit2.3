      description: Oldest first. Mock `documents.where(claimId)`. A document's `status` is what the workflow or the reviewer decided.
      x-slice-status: implemented
      responses:
        '200':
          description: Documents.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
