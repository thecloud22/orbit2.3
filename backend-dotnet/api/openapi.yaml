        `payment_due` "reissue target" row (2 business days) is written, the examiner's "payment returned" work item closes, history is appended, and an
        outbox event `payment_method_updated` is written. The next payment run pays the replacement and, when it is the last unpaid item, closes the
        claim again. The short workflow `PaymentMethodUpdatedWorkflow` (`event-<outbox event id>`) verifies the account with the bank (stub) and confirms
        to the payee (RTN-LIFE-02); if the account cannot be verified it holds the replacement item and opens a work item.
