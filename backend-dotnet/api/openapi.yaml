                  previousRunId: { type: string, format: uuid, description: The failed run this one re-runs. }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /payment-runs/returns:process:
    post:
      tags: [Payments]
      operationId: processBankReturns
      summary: The returns batch (also run by the daily job)
      description: |
        A BATCH, not a workflow. Reads the bank's returns queue (what the returns file would carry: item id, code, reason), and for each item that is
        `paid` marks it `returned` (the original stays as it was: paid items are immutable; a return only adds the code and reason), records a
        payment-method hold on that payee's closed account, appends the history, and writes a `payment_returned` outbox event, in one transaction.
        Items are locked with `FOR UPDATE SKIP LOCKED`, so two batches at once never process the same return, and an item already returned is skipped.
        The batch NEVER changes the claim: `PaymentReturnedWorkflow` (`event-<outbox event id>`) reopens the claim, letters the payee and tells the
        examiner. Returns are acknowledged to the bank only after the commit, so a crash re-reads them harmlessly.
