      summary: The examiner accepts or rejects a document the rules could not accept
      description: |
        Only a document `under_review`. Saved in Postgres BEFORE any workflow, in one transaction:

        * `accept`: the document is `accepted`, the requirement is accepted through the normal accept path (follow-up rows close; proof of loss
          completes when it was the last requirement), the review row (`document_review_by`) and the examiner's work item close. No workflow (nothing
          outside Postgres to call).
