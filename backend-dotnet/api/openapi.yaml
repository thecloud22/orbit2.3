      responses:
        '200':
          description: The clock after the move, and what is due now.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevClockAdvanced' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /dev/clock:reset:
    post:
      tags: [dev]
      operationId: resetDevClock
      summary: Back to real time
      description: Sets the offset to zero. The only way time moves backwards; rows already written keep the virtual timestamps they were given.
      x-dev-only: true
      x-slice-status: implemented
      responses:
        '200':
          description: The clock (offset 0).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevClock' }
        '404': { $ref: '#/components/responses/NotFound' }

  /dev/faults:
    get:
      tags: [dev]
      operationId: getDevFaults
      summary: The fault switches
      description: |
        Only served when `Claims:Dev:Controls=true`. A fault makes a stub outside system, or the worker, misbehave on purpose. `active` is what is on now;
        `log` is what each fault did (newest last, in memory: cleared when the API restarts). Faults are consumed atomically: two callers never both use
        the last unit of a counted fault.
      x-dev-only: true
      x-slice-status: implemented
      responses:
        '200':
          description: The switches.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevFaults' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [dev]
      operationId: setDevFault
      summary: Switch a fault on or off, or give it a count
      description: |
        Give `name` and exactly one of `enabled` (true: on until cleared; false: off) or `count` (on for the next N uses, then off).
        Names: `letters.down` (the letters gateway throws: each send attempt counts as a use), `bank.down` (the bank file endpoint is unreachable),
        `bank.reject-next` (the bank returns the next payment it is sent, R02), `tin.no-match` (the IRS check answers "no match": each check is a use),
        `tin.down` (the IRS check fails with a 503-like error: Temporal retries it), and `worker.stall-once:<activity type>` (for example
        `worker.stall-once:LifeIntake_SendAcknowledgementAndPackets`: the first execution of that activity does its work and then hangs past the 30 s
        StartToClose timeout, as a worker killed before it reported back would, so Temporal times it out and runs it again). Unknown names are 422.
      x-dev-only: true
      x-slice-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, examples: [letters.down, 'worker.stall-once:LifeIntake_SendAcknowledgementAndPackets'] }
                enabled: { type: boolean }
                count: { type: integer, minimum: 1 }
      responses:
        '200':
          description: The switches after the change.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DevFaults' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /dev/bank/returns:
    get:
      tags: [dev]
      operationId: getDevBankReturns
      summary: The stub bank's returns queue (what its returns file holds now)
      x-dev-only: true
      x-slice-status: implemented
      responses:
        '200':
          description: The queue, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/BankReturn' } }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [dev]
      operationId: enqueueDevBankReturn
      summary: The bank returns a payment (as its returns file would, days after paying)
      description: |
        Enqueues a return in the stub bank's queue; nothing else changes. The returns batch (`POST /payment-runs/returns:process`, or the daily job) reads
        the queue and does the rest. The item must exist and be `paid` (422 `item_not_paid`).
      x-dev-only: true
      x-slice-status: implemented
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [paymentItemId, reasonCode]
              properties:
                paymentItemId: { type: string, format: uuid }
                reasonCode: { type: string, pattern: '^R[0-9]{2}$', examples: [R02] }
                reasonText: { type: string, examples: [Account closed] }
      responses:
        '201':
          description: Queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BankReturn' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'The intended scheme (org identity provider). NOT enforced yet: the service is unauthenticated and trusts X-Actor. See the README, not built yet.'
  headers:
    ETag:
      description: The resource's version, quoted. Send it back as `If-Match`.
      schema: { type: string, examples: ['"3"'] }

  parameters:
    ClaimId: { name: claimId, in: path, required: true, schema: { type: string, format: uuid } }
    RequirementId: { name: requirementId, in: path, required: true, schema: { type: string, format: uuid } }
    DeadlineId: { name: deadlineId, in: path, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A client-generated unique key (for example a UUID), 8 to 128 characters.
      schema: { type: string, minLength: 8, maxLength: 128 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The ETag from the last GET of this resource.
      schema: { type: string, examples: ['"3"'] }
    ActorRequired:
      name: X-Actor
      in: header
      required: true
      description: 'The acting staff user''s handle (`rachel`, `monica`). Development placeholder for authentication. Missing is 400 `missing_header`, unknown is 403 `unknown_actor`.'
      schema: { type: string, examples: [rachel] }
    DecisionId: { name: decisionId, in: path, required: true, schema: { type: string, format: uuid } }
    PaymentItemId: { name: paymentItemId, in: path, required: true, schema: { type: string, format: uuid } }
    PaymentRunId: { name: paymentRunId, in: path, required: true, schema: { type: string, format: uuid } }
    WorkItemId: { name: workItemId, in: path, required: true, schema: { type: string, format: uuid } }
    DocumentId: { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
    PartyId: { name: partyId, in: path, required: true, schema: { type: string, format: uuid } }
    WorkflowRunId: { name: workflowRunId, in: path, required: true, description: 'The `id` of a workflow run record (not Temporal''s run id).', schema: { type: string, format: uuid } }
    Actor:
      name: X-Actor
      in: header
      required: false
      description: Development placeholder for the acting user until authentication is built.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      description: Opaque; the `nextCursor` of the previous page.
      schema: { type: string }

  responses:
    BadRequest:
      description: The request could not be read (malformed JSON, bad header or cursor).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Forbidden:
      description: 'The actor may not do this (`unknown_actor`, `not_permitted`, `approver_not_authorized`, `self_approval`).'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    NotFound:
      description: No such resource.
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Conflict:
      description: The request conflicts with the resource's state (`invalid_state`, `idempotency_key_reuse`, `deadline_not_open`, `claim_not_ready_to_decide`, `not_awaiting_approval`, `item_in_run`, ...).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    PreconditionFailed:
      description: '`If-Match` is stale (`version_conflict`). Fetch the resource again.'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    PreconditionRequired:
      description: '`If-Match` is required (`precondition_required`).'
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
    Unprocessable:
      description: Well formed but not valid (`validation_failed` with field errors, or a business-rule code such as `payee_shares_invalid`).
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: Stable, machine-readable. Clients branch on this, not on `detail`.
          examples: [validation_failed, version_conflict, idempotency_key_reuse]
        errors:
          type: array
          description: Field-level details for `validation_failed`.
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string, pattern: '^[0-9]{1,13}(\.[0-9]{1,2})?$', examples: ['200000.00'] }
        currency: { type: string, pattern: '^[A-Z]{3}$', examples: [USD] }

    Family: { type: string, enum: [life, disability, annuity] }
    ClaimStatus:
      type: string
      enum: [received, gathering_evidence, in_review, awaiting_approval, approved, paying, closed, reopened]
    DeadlineKind:
      type: string
      description: |
        Only `requirement_follow_up` has a workflow (the dispatcher fires it). Every other kind is a row that something else closes, or a target the
        nightly overdue check raises to a person when it is late: `document_review_by` (1 business day for the examiner to review a document the
        rules could not accept; closed by the review) and `bank_details_by` (a payee's new bank details after a returned payment, 10 days; closed by
        `update-payment-method`) are display/target rows with no automation of their own. `payment_due` also carries the "reissue a returned
        payment" target (`sla: reissue`), closed by the payment run.
      enum: [acknowledge_by, forms_by, first_contact_by, status_letter, requirement_follow_up, decision_due, review_target, payment_due, document_review_by, bank_details_by]
    DeadlineState:
      type: string
      description: open, then dispatched when the dispatcher starts its workflow, then done or skipped.
      enum: [open, dispatched, done, skipped]
    RequirementState:
      type: string
      enum: [requested, received, accepted, not_enough, waived, expired]
    WorkItemStatus: { type: string, enum: [open, done, snoozed] }

    PartyRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    LifeIntakeRequest:
      type: object
      required: [caller, insured, death, policies, designation]
      properties:
        noticeReceivedAt: { type: string, format: date-time, description: When the call started. Defaults to the server clock. }
        caller:
          type: object
          required: [name, contactBy, verifiedDateOfBirth, verifiedPolicyNumber]
          properties:
            name: { type: string, maxLength: 200 }
            relationship: { type: string }
            phone: { type: string }
            email: { type: string }
            contactBy:
              type: array
              uniqueItems: true
              items: { type: string, enum: [email, text, phone, mail] }
            verifiedDateOfBirth: { type: boolean, description: Both verification flags must be true (422 `identity_not_verified`). }
            verifiedPolicyNumber: { type: boolean }
            agentConsent: { type: boolean, default: false }
            beneficiaryRef: { type: string, description: 'The ref of the designated beneficiary the caller is, if any.' }
        insured:
          type: object
          required: [name, dateOfBirth]
          properties:
            name: { type: string }
            dateOfBirth: { type: string, format: date }
            ssnLast4: { type: string, pattern: '^[0-9]{4}$' }
        death:
          type: object
          required: [dateOfDeath, manner]
          properties:
            dateOfDeath: { type: string, format: date }
            placeOfDeath: { type: string }
            manner: { type: string, enum: [natural, accident, pending] }
            outsideUs: { type: boolean, default: false }
            funeralHome: { type: string }
        policies:
          type: array
          minItems: 1
          description: The policies being claimed, as found in policy administration. Policy administration is re-checked by the intake workflow.
          items:
            type: object
            required: [policyNumber, productCode, productName, issueDate, paidToDate, inForce, faceAmount]
            properties:
              policyNumber: { type: string }
              productCode: { type: string }
              productName: { type: string }
              issueDate: { type: string, format: date }
              paidToDate: { type: string, format: date }
              inForce: { type: boolean }
              lapsedOn: { type: [string, 'null'], format: date, description: Present exactly when `inForce` is false. }
              faceAmount: { $ref: '#/components/schemas/Money' }
              riders:
                type: array
                items:
                  type: object
                  required: [key, name, amount]
                  properties:
                    key: { type: string, examples: [adb] }
                    name: { type: string }
                    amount: { $ref: '#/components/schemas/Money' }
        designation:
          type: object
          required: [date, beneficiaries]
          properties:
            date: { type: string, format: date }
            source: { type: string }
            beneficiaries:
              type: array
              minItems: 1
              items:
                type: object
                required: [ref, name, kind, sharePercent]
                properties:
                  ref: { type: string, description: 'Client-chosen, unique within the request.' }
                  name: { type: string }
                  relationship: { type: string }
                  kind: { type: string, enum: [primary, contingent] }
                  sharePercent: { type: number, description: 'Percent. The living payees'' shares must add up to 100 (422 `payee_shares_invalid`).' }
                  dateOfBirth: { type: string, format: date }
                  diedOn: { type: string, format: date }
                  diedSource: { type: string }
                  contact:
                    type: object
                    properties:
                      phone: { type: string }
                      email: { type: string }
                      address: { type: string }
                      packet: { type: string, enum: [portal, mail] }
        agent:
          type: object
          required: [name]
          properties:
            name: { type: string }
            agency: { type: string }
        otherClaimantsPossible: { type: boolean, default: false }

    LifeDetails:
      type: object
      required: [kind, dateOfDeath, mannerOfDeath]
      properties:
        kind: { type: string, const: life }
        dateOfDeath: { type: string, format: date }
        placeOfDeath: { type: [string, 'null'] }
        mannerOfDeath: { type: string, enum: [natural, accident, pending] }
        deathOutsideUs: { type: boolean }
        funeralHome: { type: [string, 'null'] }
        callerPartyId: { type: string, format: uuid }
        callerRelationship: { type: [string, 'null'] }
        contactBy: { type: array, items: { type: string } }
        agentConsent: { type: boolean }
        otherClaimantsPossible: { type: boolean }
        intakeChannel: { type: string, enum: [phone, portal, mail, agent] }

    BenefitLine:
      type: object
      required: [id, policyNumber, kind, name, amount, status, productConfigVersion, version]
      properties:
        id: { type: string, format: uuid }
        policyNumber: { type: string }
        kind: { type: string, enum: [base, rider] }
        parentLineId: { type: [string, 'null'], format: uuid }
        riderKey: { type: [string, 'null'] }
        name: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        status:
          type: string
          enum: [gathering_evidence, cause_pending, not_payable, ready_to_decide, approved, paid, denied, closed]
        waitingOn: { type: [string, 'null'] }
        productConfigVersion: { type: string, description: The product configuration version pinned to this line. }
        version: { type: integer, format: int64 }

    ClaimParty:
      type: object
      required: [partyId, name, role, payee]
      properties:
        partyId: { type: string, format: uuid }
        name: { type: string }
        role: { type: string, enum: [insured, owner, caller, claimant, beneficiary, agent_of_record, funeral_home] }
        relationship: { type: [string, 'null'] }
        beneficiaryKind: { type: [string, 'null'], enum: [primary, contingent, null] }
        sharePercent: { type: [string, 'null'], description: 'Decimal string, for example "50.00".' }
        payee: { type: boolean }
        packetChannel: { type: [string, 'null'], enum: [portal, mail, null] }
        accessNote: { type: [string, 'null'], description: 'For an agent of record or attorney: what they may see.' }
        diedOn: { type: [string, 'null'], format: date }

    Claim:
      type: object
      required: [id, claimNumber, family, productCode, status, routeReasons, team, noticedAt, insured, benefitLines, parties, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        claimNumber: { type: string, pattern: '^[LDA]-[0-9]{2}-[0-9]{6}$', examples: [L-26-043310] }
        family: { $ref: '#/components/schemas/Family' }
        productCode: { type: string }
        status: { $ref: '#/components/schemas/ClaimStatus' }
        track: { type: [string, 'null'], enum: [fast_track_life, standard_life, null], description: Null until the intake workflow has routed the claim. }
        routeRule: { type: [string, 'null'], examples: [LF-01] }
        routeReasons: { type: array, items: { type: string } }
        ownerId: { type: [string, 'null'], format: uuid }
        team: { type: string }
        noticedAt: { type: string, format: date-time }
        proofCompleteAt: { type: [string, 'null'], format: date-time }
        closedAt: { type: [string, 'null'], format: date-time }
        insured: { $ref: '#/components/schemas/PartyRef' }
        details:
          description: Family-specific facts. Only `life` exists in this slice.
          oneOf:
            - $ref: '#/components/schemas/LifeDetails'
          discriminator:
            propertyName: kind
        benefitLines: { type: array, items: { $ref: '#/components/schemas/BenefitLine' } }
        parties: { type: array, items: { $ref: '#/components/schemas/ClaimParty' } }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ClaimSummary:
      type: object
      required: [id, claimNumber, family, productCode, status, insuredName, noticedAt, version]
      properties:
        id: { type: string, format: uuid }
        claimNumber: { type: string }
        family: { $ref: '#/components/schemas/Family' }
        productCode: { type: string }
        status: { $ref: '#/components/schemas/ClaimStatus' }
        track: { type: [string, 'null'] }
        ownerId: { type: [string, 'null'], format: uuid }
        insuredName: { type: string }
        noticedAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }

    Requirement:
      type: object
      required: [id, claimId, key, name, purpose, from, state, requestedAt, followUpDays, followUpCount, version]
      properties:
        id: { type: string, format: uuid }
        claimId: { type: string, format: uuid }
        benefitLineId: { type: [string, 'null'], format: uuid }
        key: { type: string, enum: [certificate, statement, primary_died_first, report, amended_certificate] }
        name: { type: string }
        purpose: { type: string, description: 'What it proves: "Proof of death", "Proof of claim".' }
        from:
          type: object
          required: [label]
          properties:
            partyId: { type: [string, 'null'], format: uuid }
            label: { type: string }
            detail: { type: [string, 'null'] }
        state: { $ref: '#/components/schemas/RequirementState' }
        stateNote: { type: [string, 'null'], description: 'Why it is in this state when that is not obvious: "TIN mismatch" for `not_enough`, "Under review: photocopy" for `received`.' }
        requestedAt: { type: string, format: date-time }
        followUpDays: { type: integer, description: Days until the follow-up deadline fires; 0 means never chased. }
        followUpCount: { type: integer }
        lastReminderAt: { type: [string, 'null'], format: date-time }
        receivedAt: { type: [string, 'null'], format: date-time }
        acceptedAt: { type: [string, 'null'], format: date-time }
        satisfiedBy: { type: [string, 'null'] }
        waivedAt: { type: [string, 'null'], format: date-time }
        waiveReason: { type: [string, 'null'] }
        version: { type: integer, format: int64 }
    RequirementList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Requirement' } }
        nextCursor: { type: [string, 'null'] }

    Deadline:
      type: object
      required: [id, claimId, kind, what, dueAt, originalDueAt, state, attempt, fired, version]
      properties:
        id: { type: string, format: uuid }
        claimId: { type: string, format: uuid }
        kind: { $ref: '#/components/schemas/DeadlineKind' }
        requirementId: { type: [string, 'null'], format: uuid }
        documentId: { type: [string, 'null'], format: uuid, description: 'The document a `document_review_by` row is about.' }
        partyId: { type: [string, 'null'], format: uuid, description: 'The payee a `bank_details_by` or reissue row is about.' }
        what: { type: string }
        sla: { type: [string, 'null'], description: 'The service level this row enforces: ack, forms, contact, status, decide, review, pay, docReview, reissue.' }
        dueAt: { type: string, format: date-time }
        originalDueAt: { type: string, format: date-time }
        extensionReason: { type: [string, 'null'] }
        state: { $ref: '#/components/schemas/DeadlineState' }
        attempt: { type: integer, description: Dispatch attempts so far. }
        dispatchedAt: { type: [string, 'null'], format: date-time }
        fired: { type: boolean, description: True when it came due and a deadline workflow ran for it. }
        lastOutcome: { type: [string, 'null'], enum: [started, already_started, start_failed, completed, skipped, closed_early, null] }
        lastError: { type: [string, 'null'] }
        workflowId: { type: [string, 'null'], examples: ['deadline-3f2b...'] }
        closedAt: { type: [string, 'null'], format: date-time }
        closedBy: { type: [string, 'null'], enum: [workflow, intake, requirement, decision, payment, user, null] }
        result: { type: [string, 'null'] }
        version: { type: integer, format: int64 }
    DeadlineList:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Deadline' } }
        nextCursor: { type: [string, 'null'] }

    RecordDecisionRequest:
      type: object
      required: [benefitLineId, outcome, basis]
      properties:
        benefitLineId: { type: string, format: uuid, description: 'The base line. A rider line is 422 `rider_follows_base`.' }
        outcome:
          type: string
          enum: [approve, approve_in_part, deny]
          description: 'Only `approve` is built (422 `outcome_not_supported` for the others).'
        basis: { type: string, minLength: 1 }
        evidence: { type: array, items: { type: string }, description: 'Defaults to the accepted or waived requirements.' }
        provisions: { type: array, items: { type: string }, description: 'Defaults to the mock''s "Death benefit · section 2", "Beneficiary · section 7".' }
        supersedesId: { type: string, format: uuid, description: 'Would correct an earlier decision by creating the next version. Not built: 422 `correction_not_supported`.' }

    Decision:
      type: object
      required: [id, claimId, benefitLineId, version, outcome, outcomeText, basis, recordedAt, recordedBy, authorityNote, requiresApproval, status]
      description: Immutable. Never updated or deleted; a correction is a new version. Its approval is a separate append-only record.
      properties:
        id: { type: string, format: uuid }
        claimId: { type: string, format: uuid }
        benefitLineId: { type: string, format: uuid }
        benefitLineName: { type: string }
        version: { type: integer, minimum: 1 }
        supersedesId: { type: [string, 'null'], format: uuid }
        outcome: { type: string, enum: [approved, approved_in_part, denied, closed] }
        outcomeText: { type: string, examples: ['Approved · $200,000.00 + $383.56 interest'] }
        basis: { type: string }
        evidence: { type: array, items: { type: string } }
        provisions: { type: array, items: { type: string } }
        amount: { anyOf: [ { $ref: '#/components/schemas/Money' }, { type: 'null' } ], description: "Proceeds plus interest to the pay date for THIS decision's own benefit line only: the rider is a decision of its own with its own amount, so the base decision's amount does not include it. Null when nothing is payable (a closed rider). The claim-level sum is `claimTotal` on `GET /claims/{id}/decisions`." }
        recordedAt: { type: string, format: date-time }
        recordedBy: { type: string, format: uuid }
        recordedByName: { type: string }
        authorityNote: { type: string, examples: ['within $250,000 authority'] }
        requiresApproval: { type: boolean, description: 'Above the recorder''s authority.' }
        status:
          type: string
          enum: [awaiting_approval, in_effect]
          description: '`awaiting_approval` until a team lead approves; `in_effect` once its payment items (if any) are cleared.'
        approvedBy: { type: [string, 'null'], format: uuid }
        approvedByName: { type: [string, 'null'] }
        approvedAt: { type: [string, 'null'], format: date-time }
        letterTemplate: { type: [string, 'null'], examples: [APR-LIFE-01] }

    RecordDecisionResult:
      type: object
      required: [kind, message, decision, relatedDecisions, paymentItems]
      properties:
        kind: { type: string, enum: [recorded, awaiting_approval], description: 'The mock''s `recorded` and `sentForApproval`.' }
        message: { type: string }
        decision: { $ref: '#/components/schemas/Decision' }
        relatedDecisions: { type: array, items: { $ref: '#/components/schemas/Decision' }, description: 'The riders decided with the base line.' }
        paymentItems: { type: array, items: { $ref: '#/components/schemas/PaymentItem' }, description: 'Empty until the decision is in effect.' }
        approvalWorkItemId: { type: [string, 'null'], format: uuid, description: 'Set when `awaiting_approval`: the team lead''s work item.' }

    PaymentItem:
      type: object
      required: [id, claimId, benefitLineId, kind, payeePartyId, basis, principal, interest, amount, method, payOn, status, version]
      properties:
        id: { type: string, format: uuid }
        claimId: { type: string, format: uuid }
        benefitLineId: { type: string, format: uuid }
        decisionId: { type: [string, 'null'], format: uuid }
        kind: { type: string, enum: [benefit, adjustment] }
        adjustsItemId: { type: [string, 'null'], format: uuid, description: 'For an adjustment, the item it corrects. Paid items are never edited.' }
        replacementOfId: { type: [string, 'null'], format: uuid, description: 'For a replacement of a returned item: the returned item it replaces (a new item; the returned one is never edited).' }
        replacedById: { type: [string, 'null'], format: uuid, description: 'For a returned item, the replacement item created for it.' }
        paymentMethodId: { type: [string, 'null'], format: uuid, description: 'The payee''s new account this item pays to; null means the account on file at intake.' }
        payeePartyId: { type: string, format: uuid }
        payeeName: { type: string }
        basis: { type: string, examples: ['50% of $200,000.00 + $191.78 interest'] }
        principal: { $ref: '#/components/schemas/Money' }
        interest: { $ref: '#/components/schemas/Money' }
        amount: { $ref: '#/components/schemas/Money' }
        method: { type: string, enum: [eft, check], description: 'EFT, or a check for a payee whose packet goes by mail.' }
        payOn: { type: string, format: date, description: 'The earliest run date that may pay it.' }
        status:
          type: string
          enum: [awaiting_proof, cleared, in_run, paid, held, cancelled, returned]
          description: 'awaiting_proof, cleared, in_run, paid; held (by a person), cancelled, returned (by the bank). Paid items never change; a return is followed by a new replacement item.'
        holdReason: { type: [string, 'null'] }
        runId: { type: [string, 'null'], format: uuid }
        paidAt: { type: [string, 'null'], format: date-time }
        paymentReference: { type: [string, 'null'], description: 'The bank''s reference for a paid item.' }
        returnCode: { type: [string, 'null'], description: 'The bank''s reason code when returned (R02 account closed).' }
        returnReason: { type: [string, 'null'] }
        version: { type: integer, format: int64 }

    PaymentRun:
      type: object
      required: [id, runDate, status, trigger, itemCount, total, startedAt]
      properties:
        id: { type: string, format: uuid }
        runDate: { type: string, format: date }
        status: { type: string, enum: [building, sent, reconciled, failed] }
        trigger: { type: string, enum: [schedule, manual] }
        itemCount: { type: integer }
        paidCount: { type: integer }
        returnedCount: { type: integer }
        total: { $ref: '#/components/schemas/Money' }
        fileReference: { type: [string, 'null'] }
        error: { type: [string, 'null'], description: 'Why the run failed (the bank was unreachable).' }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }

    Staff:
      type: object
      required: [id, handle, name, team, role, payoutLimit]
      properties:
        id: { type: string, format: uuid }
        handle: { type: string, examples: [rachel] }
        name: { type: string, examples: [Rachel Kim] }
        title: { type: [string, 'null'] }
        team: { type: string }
        role: { type: string, enum: [life_examiner, di_case_manager, annuity_specialist, team_lead] }
        payoutLimit: { $ref: '#/components/schemas/Money' }

    Letter:
      type: object
      required: [id, claimId, templateCode, channel, recipientLabel, subject, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        claimId: { type: string, format: uuid }
        benefitLineId: { type: [string, 'null'], format: uuid }
        templateCode: { type: string, examples: [ACK-LIFE-01] }
        channel: { type: string, enum: [letter, email, sms, portal, fax] }
        recipientPartyId: { type: [string, 'null'], format: uuid }
        recipientLabel: { type: string }
        subject: { type: string }
        summary: { type: [string, 'null'] }
        status:
          type: string
          enum: [draft, queued, sent, failed, skipped]
          description: |
            `skipped` is new: the letter was queued but the situation changed before it went (for example a re-run of the document workflow accepted the
            W-9 that run 1 had asked to be corrected), so it will never be sent; `statusReason` says why. A workflow that has finished leaves no letter `queued`.
        statusReason: { type: [string, 'null'], description: 'Why the letter is `skipped`; null otherwise. Additive.' }
        sentAt: { type: [string, 'null'], format: date-time }
        workflowId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }

    HistoryEvent:
      type: object
      required: [id, claimId, occurredAt, recordedAt, type, title, actorKind, actor]
      properties:
        id: { type: string, format: uuid }
        claimId: { type: string, format: uuid }
        occurredAt: { type: string, format: date-time, description: When it happened on the claim. }
        recordedAt: { type: string, format: date-time, description: When we wrote it. }
        type: { type: string, enum: [decision, data, document, communication, task, access, assistant, payment] }
        title: { type: string }
        actorKind: { type: string, enum: [user, system, workflow, batch, portal], description: Structured actor; the mock packed this into a free-text `actor` string. }
        actor:
          type: string
          description: |
            Who did it, named the same way on every event: for `actorKind` `user`, the staff member's display name ("Rachel Kim") when the handle in `X-Actor` is an active user of `GET /staff`
            (any case), otherwise the handle as sent ("examiner.dev" when X-Actor was absent, "ops.dev"); for `system`, `workflow`, `batch` and `portal`, the label or workflow id. Events written before this rule may carry a raw handle.
        detail: { type: [string, 'null'] }
        ref: { type: [string, 'null'] }
        workflowId: { type: [string, 'null'] }

    WorkItem:
      type: object
      required: [id, claimId, priority, action, why, dueOn, waitingOn, section, status, version]
      properties:
        id: { type: string, format: uuid }
        ownerId: { type: [string, 'null'], format: uuid, description: Null for a team-queue item nobody has picked up. }
        claimId: { type: string, format: uuid }
        priority: { type: integer, enum: [1, 2, 3] }
        action: { type: string }
        why: { type: string }
        dueOn: { type: string, format: date }
        waitingOn: { type: string }
        flag: { type: [string, 'null'] }
        section: { type: string, description: 'Claim section the item points at: workflow, requirements, decision, ...' }
        status: { $ref: '#/components/schemas/WorkItemStatus' }
        version: { type: integer, format: int64 }

    RunStep:
      type: object
      required: [label, detail, system, state]
      properties:
        label: { type: string }
        detail: { type: string }
        system: { type: string, description: The system the step talks to. }
        state: { type: string, enum: [done, retried, skipped, failed], description: 'retried = Temporal ran the step again and it then succeeded; failed = the retries ran out (the run failed).' }
        attempts: { type: integer, minimum: 1, default: 1, description: 'How many times Temporal ran the step (1 = first time).' }
        note: { type: [string, 'null'], description: 'What Temporal did for this step, in plain words.' }

    WorkflowRun:
      type: object
      required: [id, workflowId, runId, type, name, startedBy, status, startedAt, steps, saved]
      properties:
        id: { type: string, format: uuid }
        workflowId: { type: string, examples: ['orch-L-26-043310-intake', 'deadline-3f2b...', 'event-...'] }
        runId: { type: string, description: Temporal's run id. }
        type: { type: string, enum: [orchestration, event, deadline] }
        name: { type: string }
        claimId: { type: [string, 'null'], format: uuid }
        startedBy: { type: string }
        triggerKind: { type: [string, 'null'], enum: [outbox_event, deadline, null] }
        triggerId: { type: [string, 'null'], format: uuid }
        status: { type: string, enum: [running, completed, skipped, needs_review, failed] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        steps: { type: array, items: { $ref: '#/components/schemas/RunStep' } }
        saved: { type: array, items: { type: string }, description: 'What the run wrote back to Postgres, in one transaction.' }
        error: { type: [string, 'null'] }
        runNo: { type: integer, minimum: 1, description: '1 for the first run of a workflow id; 2 for an ops re-run after it failed.' }
        rerunOfId: { type: [string, 'null'], format: uuid, description: 'For a re-run, the failed run it re-runs.' }
        note: { type: [string, 'null'], description: '"What Temporal did": the run''s story in plain words (retries, the failure, the re-run, the fault that caused it).' }
        elapsedMs: { type: [integer, 'null'], description: 'Real time the run took, from its first activity to its end.' }
        canRerun: { type: boolean, description: 'True for a failed run that is the latest of its workflow id: `POST /workflow-runs/{id}:rerun`.' }

    DevClock:
      type: object
      required: [now, realNow, offsetSeconds, virtual, businessDate, zone]
      properties:
        now: { type: string, format: date-time, description: The virtual time every business decision uses. }
        realNow: { type: string, format: date-time }
        offsetSeconds: { type: number }
        virtual: { type: boolean, description: True when the offset is not zero. }
        businessDate: { type: string, format: date, description: The date of `now` in the business zone. }
        zone: { type: string, examples: [America/Chicago] }

    DevClockAdvanced:
      allOf:
        - $ref: '#/components/schemas/DevClock'
        - type: object
          required: [dueDeadlines]
          properties:
            dueDeadlines:
              type: array
              description: Open deadline rows whose `dueAt` is now at or before `now`, oldest first.
              items:
                type: object
                required: [id, claimId, kind, what, dueAt]
                properties:
                  id: { type: string, format: uuid }
                  claimId: { type: string, format: uuid }
                  kind: { $ref: '#/components/schemas/DeadlineKind' }
                  what: { type: string }
                  dueAt: { type: string, format: date-time }

    Document:
      type: object
      required: [id, claimId, kind, source, attributes, status, receivedAt, version]
      properties:
        id: { type: string, format: uuid }
        claimId: { type: string, format: uuid }
        requirementId: { type: [string, 'null'], format: uuid }
        requirementName: { type: [string, 'null'] }
        partyId: { type: [string, 'null'], format: uuid, description: The person the document is from (a payee for a claimant statement). }
        partyName: { type: [string, 'null'] }
        kind: { type: string, enum: [claimant_statement_w9, death_certificate, police_report, other] }
        source: { type: string, enum: [portal, mail_room, upload] }
        attributes:
          type: object
          properties:
            tinMasked: { type: [string, 'null'], examples: ['***-**-6789'], description: 'The taxpayer number as sent, masked to its last 4 digits.' }
            photocopy: { type: [boolean, 'null'] }
            sealPresent: { type: [boolean, 'null'] }
        status:
          type: string
          enum: [received, accepted, not_enough, under_review, rejected]
          description: 'received (saved, the workflow has not decided yet), accepted, not_enough (the IRS check said no match), under_review (a person must decide), rejected (by the examiner).'
        statusNote: { type: [string, 'null'], examples: ['TIN mismatch', 'Photocopy: no raised seal'] }
        receivedAt: { type: string, format: date-time }
        receivedBy: { type: string }
        reviewedBy: { type: [string, 'null'] }
        reviewedAt: { type: [string, 'null'], format: date-time }
        reviewReason: { type: [string, 'null'] }
        workflowId: { type: [string, 'null'], examples: ['event-3f2b...'], description: 'The event workflow that handled it, once the outbox relay has started it.' }
        version: { type: integer, format: int64 }

    ReceiveDocumentRequest:
      type: object
      required: [kind, source]
      properties:
        requirementId: { type: string, format: uuid }
        requirementKey: { type: string, enum: [certificate, statement, primary_died_first, report, amended_certificate], description: 'Used when `requirementId` is not given.' }
        partyId: { type: string, format: uuid, description: 'With `requirementKey: statement`, whose statement it is.' }
        kind: { type: string, enum: [claimant_statement_w9, death_certificate, police_report, other] }
        source: { type: string, enum: [portal, mail_room, upload] }
        receivedAt: { type: string, format: date-time, description: When it arrived. Defaults to the server clock. }
        attributes:
          type: object
          properties:
            tin: { type: string, description: 'The taxpayer number on a W-9 (9 digits, dashes allowed). Only the last 4 digits are ever shown.' }
            photocopy: { type: boolean }
            sealPresent: { type: boolean }

    ReturnsProcessed:
      type: object
      required: [readAt, read, processed, skipped]
      properties:
        readAt: { type: string, format: date-time }
        read: { type: integer, description: Returns read from the bank's queue. }
        processed:
          type: array
          items:
            type: object
            required: [paymentItemId, claimId, payeeName, amount, returnCode, outboxEventId]
            properties:
              paymentItemId: { type: string, format: uuid }
              claimId: { type: string, format: uuid }
              payeeName: { type: string }
              amount: { $ref: '#/components/schemas/Money' }
              returnCode: { type: string }
              returnReason: { type: [string, 'null'] }
              outboxEventId: { type: string, format: uuid, description: 'The `payment_returned` event; its workflow is `event-<this id>`.' }
        skipped:
          type: array
          items:
            type: object
            required: [paymentItemId, reason]
            properties:
              paymentItemId: { type: string, format: uuid }
              reason: { type: string, enum: [not_found, not_paid, locked_by_another_batch], description: 'not_paid covers an item already returned (a repeat) or one that was never paid.' }

    PaymentMethod:
      type: object
      required: [id, partyId, claimId, kind, routingLast4, accountLast4, status, createdAt, version]
      properties:
        id: { type: string, format: uuid }
        partyId: { type: string, format: uuid }
        claimId: { type: string, format: uuid }
        kind: { type: string, enum: [eft] }
        routingLast4: { type: string }
        accountLast4: { type: string }
        holderName: { type: [string, 'null'] }
        status: { type: string, enum: [pending_verification, verified, rejected] }
        createdAt: { type: string, format: date-time }
        verifiedAt: { type: [string, 'null'], format: date-time }
        version: { type: integer, format: int64 }

    PaymentMethodHold:
      type: object
      required: [id, partyId, claimId, sourceItemId, reason, createdAt]
      description: 'The payee''s account on file (the one the payment went to) is closed: no item that pays to it is paid, while the hold lasts.'
      properties:
        id: { type: string, format: uuid }
        partyId: { type: string, format: uuid }
        claimId: { type: string, format: uuid }
        sourceItemId: { type: string, format: uuid, description: The returned payment item that caused the hold. }
        reason: { type: string, examples: ['R02 Account closed'] }
        createdAt: { type: string, format: date-time }
        supersededByMethodId: { type: [string, 'null'], format: uuid, description: The new account that replaced it. }

    PaymentMethodUpdated:
      type: object
      required: [paymentMethod, replacementItems]
      properties:
        paymentMethod: { $ref: '#/components/schemas/PaymentMethod' }
        replacementItems: { type: array, items: { $ref: '#/components/schemas/PaymentItem' } }
        reissueDeadline: { oneOf: [{ $ref: '#/components/schemas/Deadline' }, { type: 'null' }], description: 'The 2-business-day "reissue a returned payment" row.' }

    BankReturn:
      type: object
      required: [paymentItemId, reasonCode, queuedAt]
      properties:
        paymentItemId: { type: string, format: uuid }
        reasonCode: { type: string, examples: [R02] }
        reasonText: { type: [string, 'null'] }
        queuedAt: { type: string, format: date-time }

    DevFaults:
      type: object
      required: [active, available, log]
      properties:
        active:
          type: array
          items:
            type: object
            required: [name, since]
            properties:
              name: { type: string }
              count: { type: [integer, 'null'], description: 'Uses left; null means on until cleared.' }
              since: { type: string, format: date-time }
        available:
          type: array
          items:
            type: object
            required: [name, description]
            properties:
              name: { type: string, description: 'For a worker stall the pattern `worker.stall-once:<activity type>`.' }
              description: { type: string }
        log:
          type: array
          description: What faults did, oldest first (the last 200).
          items:
            type: object
            required: [at, name, detail]
            properties:
              at: { type: string, format: date-time }
              name: { type: string }
              detail: { type: string }
