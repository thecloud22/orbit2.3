          follow-up row close, and an outbox event `document_rejected` is written. The short workflow `DocumentRejectedWorkflow`
          (`event-<outbox event id>`) then sends the "certified copy needed" letter (REQ-LIFE-03, idempotency key per document). If the letters
          service is down Temporal retries the send 5 times (waits 2, 4, 8, 16 s); the run is recorded `failed`, an ops work item is opened, and the run
          stays visible until an operator re-runs it (`POST /workflow-runs/{id}:rerun`).

